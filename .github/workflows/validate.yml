name: Validate module
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/main.mjs
          node --check scripts/logic.mjs
      - name: Validate package and run tests
        run: |
          node -e "const m=require('./module.json'); if(m.id!=='rpgup-das-gm-only-overrides'||!m.download.endsWith('/module.zip'))process.exit(1)"
          node --test tests/*.test.mjs
      - name: Confirm ZIP was committed
        run: test -s module.zip
